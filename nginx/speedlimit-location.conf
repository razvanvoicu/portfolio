# Relative app URLs let the PWA work here and at speedlimit.raz.sg.
location = /speedlimit { return 301 /speedlimit/; }
location /speedlimit/ {
    alias /srv/www/speedlimit/;
    index index.html;
}
location = /speedlimit/sw.js {
    alias /srv/www/speedlimit/sw.js;
    add_header Cache-Control "no-cache";
}
