# Shared by every site's server block: proxies the common stats backend at
# the same hostname the browser is already using, so fetch() calls from any
# site stay same-origin (no CORS, cookies work automatically).
location /stats/ {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Site-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
