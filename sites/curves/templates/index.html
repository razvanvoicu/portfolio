<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Curves</title><link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png?v=2"><link rel="apple-touch-icon" href="/icons/icon-180.png?v=2"><link rel="stylesheet" href="/style.css"></head>
<body><div class="shell">
<aside class="sidebar"><div class="brand"><span class="mark"><img src="/icons/icon-192.png?v=2" alt=""></span><div><strong>Curves</strong><small>PARAMETRIC STUDIO</small></div></div><button id="new" class="new">＋ New curve</button><div class="library-head"><span>YOUR CURVES</span><span id="count">0</span></div><div id="library" class="library"></div><div class="workspace-actions"><div class="file-actions"><button id="export" class="clear" type="button">Export</button><button id="import" class="clear" type="button">Import</button></div><button id="clear" class="clear" type="button">Clear workspace</button><input id="import-file" type="file" accept="application/json,.json" hidden></div></aside>
<main><header><div><p class="eyebrow">CURVE WORKSPACE</p><h1 id="heading">New curve</h1></div><span class="autosave"><i></i><span id="storage">Workspace saved locally</span></span></header>
<div class="layout"><div class="definition-stack"><section class="controls"><div class="section-label">DEFINITION</div><div class="curve-name-row"><label class="field">Curve name<input id="name" type="text" placeholder="Name your curve" autocomplete="off"></label><button id="formula-edit" class="clear icon-button" type="button" aria-label="Edit curve formula" title="Edit curve formula"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4-.8L19.4 7.8l-3.2-3.2L4.8 16zM14.8 6l3.2 3.2"/></svg></button></div><label class="field">Define using<select id="type"><option value="equation">Equations</option><option value="analytic">Analytical expression</option><option value="translate">Translation</option><option value="rotate">Rotation</option><option value="scale">Scaling</option><option value="reverse">Reverse</option><option value="shift">Shift</option><option value="morph">Simple morph</option><option value="slice">Slice</option><option value="concat">Concatenation</option><option value="iterate">Iterated concatenation</option><option value="splice">Splicing</option></select></label><div id="fields"></div><p class="error" id="error" role="status"></p><div class="actions"><button id="save" class="primary">Save curve</button><button id="delete" class="danger" hidden>Delete</button></div></section>
<section class="drawing" aria-labelledby="drawing-title"><div class="section-label" id="drawing-title">DRAWING</div><div class="drawing-colors"><label class="field">Color at t = 0<input id="drawing-start" type="color"></label><label class="field">Color at t = 0.5<input id="drawing-end" type="color"></label></div><label class="field">Thickness<input id="drawing-thickness" type="number" min="0" step="any" inputmode="decimal"></label><p class="error" id="drawing-error" role="status"></p><div class="section-label">ANIMATION</div><label class="animation-toggle"><input id="shift-enabled" type="checkbox"><span>Shift animation</span></label><label class="field" for="shift-duration">Cycle duration · seconds</label><div class="animation-speed"><input id="shift-duration" type="range" min="0.5" max="20" step="any"><output id="shift-duration-value" for="shift-duration"></output></div><div id="morph-animation" class="morph-animation" hidden><label class="animation-toggle"><input id="morph-enabled" type="checkbox"><span>Morph animation</span></label><div class="field"><span>Morph range</span><div class="range-values"><output id="morph-min-value" for="morph-min"></output><output id="morph-max-value" for="morph-max"></output></div><div class="dual-range"><input id="morph-min" aria-label="Minimum morph factor" type="range" min="0" max="1" step="any"><input id="morph-max" aria-label="Maximum morph factor" type="range" min="0" max="1" step="any"></div></div><label class="field" for="morph-duration">Oscillation period · seconds</label><div class="animation-speed"><input id="morph-duration" type="range" min="0.5" max="20" step="any"><output id="morph-duration-value" for="morph-duration"></output></div></div></section></div>
<section class="preview"><div class="preview-top"><div><p class="eyebrow">LIVE PREVIEW</p><h2>Canvas</h2></div><div class="preview-settings"><span>−100 to 100</span><label><input id="canvas-grid" type="checkbox"> Grid</label><details class="background-control"><summary>Background gradient</summary><div class="background-fields"><label>First color <input id="canvas-start" type="color"></label><label>Second color <input id="canvas-end" type="color"></label><label>Gradient <select id="canvas-type"><option value="radial">Radial</option><option value="transversal">Transversal</option></select></label><label id="canvas-angle-label">Angle (degrees) <input id="canvas-angle" type="number" step="any"></label></div></details></div></div><div class="canvas-wrap"><canvas id="canvas" width="800" height="800" aria-label="Curve preview, coordinates from minus 100 to 100"></canvas></div><div class="preview-foot"><span>ORIGIN <b>0, 0</b></span><span>PARAMETER <b>0 ≤ t ≤ 1</b></span></div></section></div></main></div>
<dialog id="formula-dialog"><div class="dialog-head"><div><p class="eyebrow">FORMULA EDITOR</p><h2 id="formula-title">Edit formula</h2></div><button id="close-formula" aria-label="Close formula editor">✕</button></div><iframe id="formula-frame" title="Formula editor"></iframe></dialog>
<dialog id="exchange-dialog" class="exchange-dialog" aria-labelledby="exchange-title"><h2 id="exchange-title">Edit curve formula</h2><label for="exchange-text">JavaScript expression</label><textarea id="exchange-text" spellcheck="false"></textarea><label class="exchange-morph"><input id="exchange-with-morph" type="checkbox"> With morph factor</label><p id="exchange-error" class="error" role="status"></p><div class="exchange-actions"><button id="exchange-copy" class="clear icon-button" type="button" aria-label="Copy formula" title="Copy formula"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="12" rx="1"/><path d="M16 8V4H5v12h3"/></svg></button><button id="exchange-paste" class="clear icon-button" type="button" aria-label="Paste formula" title="Paste formula"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5H5v15h14V5h-4M9 4h6v3H9z"/></svg></button><button id="exchange-close" class="primary" type="button">Done</button></div></dialog>
<dialog id="import-dialog" class="import-dialog" aria-labelledby="import-title"><h2 id="import-title">Import workspace</h2><p id="import-message"></p><div id="import-options" class="import-options"></div><button id="import-cancel" class="clear" type="button">Cancel</button></dialog>
<script src="/formula/jsformula.js"></script><script src="/curve-formula.js"></script><script src="/curves.js"></script><script src="/workspace.js"></script><script src="/drawing.js"></script><script src="/animation.js"></script><script src="/canvas-settings.js"></script><script src="/clipboard.js"></script><script src="/app.js"></script></body></html>
