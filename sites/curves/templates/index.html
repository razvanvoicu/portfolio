<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Curves</title><link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png"><link rel="apple-touch-icon" href="/icons/icon-180.png"><link rel="stylesheet" href="/style.css"></head>
<body><div class="shell">
<aside class="sidebar"><div class="brand"><span class="mark"><img src="/icons/icon-192.png" alt=""></span><div><strong>Curves</strong><small>PARAMETRIC STUDIO</small></div></div><button id="new" class="new">＋ New curve</button><div class="library-head"><span>YOUR CURVES</span><span id="count">0</span></div><div id="library" class="library"></div><div class="workspace-actions"><div class="file-actions"><button id="export" class="clear" type="button">Export</button><button id="import" class="clear" type="button">Import</button></div><button id="clear" class="clear" type="button">Clear workspace</button><input id="import-file" type="file" accept="application/json,.json" hidden></div></aside>
<main><header><div><p class="eyebrow">CURVE WORKSPACE</p><h1 id="heading">New curve</h1></div><span class="autosave"><i></i><span id="storage">Workspace saved locally</span></span></header>
<div class="layout"><section class="controls"><div class="section-label">DEFINITION</div><label class="field">Curve name<input id="name" type="text" placeholder="Name your curve" autocomplete="off"></label><label class="field">Define using<select id="type"><option value="equation">Equations</option><option value="translate">Translation</option><option value="rotate">Rotation</option><option value="scale">Scaling</option><option value="reverse">Reverse</option><option value="shift">Shift</option><option value="morph">Simple morph</option><option value="slice">Slice</option><option value="concat">Concatenation</option><option value="iterate">Iterated concatenation</option><option value="splice">Splicing</option></select></label><div id="fields"></div><p class="error" id="error" role="status"></p><div class="actions"><button id="save" class="primary">Save curve</button><button id="delete" class="danger" hidden>Delete</button></div></section>
<section class="preview"><div class="preview-top"><div><p class="eyebrow">LIVE PREVIEW</p><h2>Canvas</h2></div><span>−100 to 100</span></div><div class="canvas-wrap"><canvas id="canvas" width="800" height="800" aria-label="Curve preview, coordinates from minus 100 to 100"></canvas></div><div class="preview-foot"><span>ORIGIN <b>0, 0</b></span><span>PARAMETER <b>0 ≤ t ≤ 1</b></span></div></section></div></main></div>
<dialog id="formula-dialog"><div class="dialog-head"><div><p class="eyebrow">FORMULA EDITOR</p><h2 id="formula-title">Edit formula</h2></div><button id="close-formula" aria-label="Close formula editor">✕</button></div><iframe id="formula-frame" title="Formula editor"></iframe></dialog>
<dialog id="import-dialog" class="import-dialog" aria-labelledby="import-title"><h2 id="import-title">Import workspace</h2><p id="import-message"></p><div id="import-options" class="import-options"></div><button id="import-cancel" class="clear" type="button">Cancel</button></dialog>
<script src="/formula/jsformula.js"></script><script src="/curves.js"></script><script src="/workspace.js"></script><script src="/app.js"></script></body></html>
