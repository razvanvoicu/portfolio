<svg viewBox="0 0 480 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="480" height="1024" fill="#0f172a"/>

  <!-- Title -->
  <text x="240" y="120" font-size="72" font-weight="bold" fill="#22d3ee" text-anchor="middle">Cadence</text>
  <text x="240" y="200" font-size="72" font-weight="bold" fill="#22d3ee" text-anchor="middle">Reps</text>

  <!-- Reps Label -->
  <text x="40" y="290" font-size="32" fill="#94cff3">Reps</text>

  <!-- Reps Input Box -->
  <rect x="40" y="310" width="400" height="90" fill="none" stroke="#0e7490" stroke-width="2" rx="8"/>
  <text x="240" y="390" font-size="48" fill="#0e7490" text-anchor="middle">10</text>

  <!-- Seconds per Rep Label -->
  <text x="40" y="530" font-size="32" fill="#94cff3">Seconds per rep</text>

  <!-- Seconds Input Box -->
  <rect x="40" y="550" width="400" height="90" fill="none" stroke="#0e7490" stroke-width="2" rx="8"/>
  <text x="240" y="630" font-size="48" fill="#0e7490" text-anchor="middle">2</text>

  <!-- Start Button -->
  <rect x="40" y="720" width="400" height="100" fill="#06b6d4" rx="8"/>
  <text x="240" y="800" font-size="48" font-weight="bold" fill="#000" text-anchor="middle">Start</text>
</svg>