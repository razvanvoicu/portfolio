<svg viewBox="0 0 480 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="480" height="1024" fill="#0f172a"/>

  <!-- Timer -->
  <text x="60" y="80" font-size="56" fill="#cbd5e1">0:00</text>

  <!-- Speaker Icon -->
  <g transform="translate(420, 40)">
    <path d="M -15 -20 L 0 -10 L 0 10 L -15 20 M 5 -25 Q 20 -10 20 0 Q 20 10 5 25" stroke="#06b6d4" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Large Play Button Circle -->
  <circle cx="240" cy="450" r="130" fill="none" stroke="#06b6d4" stroke-width="3"/>

  <!-- Play Triangle -->
  <polygon points="200,410 200,490 290,450" fill="#06b6d4"/>

  <!-- Back Button -->
  <rect x="40" y="900" width="400" height="90" fill="none" stroke="#06b6d4" stroke-width="2" rx="8"/>
  <text x="240" y="970" font-size="40" fill="#06b6d4" text-anchor="middle">← Back</text>
</svg>