[project]
name = "portfolio"
version = "1.0.1"
description = "Build and package host-routed static sites for nginx."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docutils==0.22.2",
]

[dependency-groups]
dev = [
    "poethepoet==0.37.0",
    "pytest==8.4.2",
    "selenium==4.35.0",
]

[tool.uv]
package = false

[tool.poe]
executor.type = "uv"

[tool.poe.tasks.insert]
cmd = "python scripts/insert.py"
help = "Render one RST source at every matching HTML insertion marker."

[tool.poe.tasks.build]
cmd = "python scripts/build.py"
help = "Render all RST insertions and stage the Docker build content."

[tool.poe.tasks.pull]
cmd = "python scripts/docker.py pull"
help = "Pull the pinned upstream nginx image."

[tool.poe.tasks.image]
cmd = "python scripts/docker.py build"
help = "Build the sites and create the local Docker image."

[tool.poe.tasks.run]
cmd = "python scripts/docker.py run"
help = "Replace and run the local container on port 8000."

[tool.poe.tasks.stop]
cmd = "python scripts/docker.py stop"
help = "Stop and remove the local container."

[tool.poe.tasks.test]
cmd = "pytest"
help = "Run the automated tests."

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
